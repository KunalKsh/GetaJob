{% extends "base.html" %}
{% block title %}Sign in · {{ APP_NAME }}{% endblock %}
{% block mainclass %}narrow{% endblock %}
{% block content %}
<form method="post" action="/login" class="panel authbox">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <input type="hidden" name="next" value="{{ next }}">
  <h1>Sign in</h1>
  {% if error %}<div class="notice err" role="alert">{{ error }}</div>{% endif %}
  <label class="f" for="email">Email<input id="email" type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus></label>
  <label class="f" for="password">Password<input id="password" type="password" name="password" autocomplete="current-password" required></label>
  <button class="btn big" type="submit">Sign in</button>
  <p class="small muted">No account? <a href="/request-access">Request access</a>. Forgot your password? Ask the admin for a reset link.</p>
</form>
{% endblock %}
