# Companies searched directly through their public job boards.
# Every entry below was checked on 30 Oct 2026 and had India openings at the time.
# Edit this file (or the box on the Settings page) to add companies. A wrong name just shows an
# error on the Source Health page; it doesn't stop the other companies.
#
# How to find a company's board:
#   Greenhouse:      job-boards.greenhouse.io/<token>          -> token
#   Lever:           jobs.lever.co/<company>                   -> company
#   Ashby:           jobs.ashbyhq.com/<org>                    -> org
#   Workable:        apply.workable.com/<account>              -> account
#   SmartRecruiters: jobs.smartrecruiters.com/<id>             -> id
#   Workday:         <tenant>.<host>.myworkdayjobs.com/en-US/<site>   -> tenant, host, site

