# Wakes the hosted site and starts a job update twice a day.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SITE_URL     e.g. https://getajob.onrender.com
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on Render
name: scheduled job update
on:
  schedule:
    - cron: "17 1,13 * * *"   # 06:47 and 18:47 IST
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger update
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL or CRON_SECRET not set; skipping."; exit 0; fi
          # first request wakes a sleeping free instance
          curl -s -o /dev/null --max-time 120 "$SITE_URL/healthz" || true
          curl -sf --max-time 60 -X POST -H "X-Cron-Token: $CRON_SECRET" "$SITE_URL/api/cron/refresh"
